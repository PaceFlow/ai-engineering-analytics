name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify release versions
        run: python3 packaging/publish.py --check-tag
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: python3 -m unittest discover -s packaging -p "test_*.py"
      - name: Verify standalone source packages
        run: python3 packaging/verify_packages.py

  test:
    needs: validate
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets --locked --quiet

  package:
    name: package (${{ matrix.product }}, ${{ matrix.platform.target }})
    needs: test
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        product: [vca, paceflow]
        platform:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            ext: zip
            binary_ext: .exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
            binary_ext: ""
          - os: macos-14
            target: aarch64-apple-darwin
            ext: tar.gz
            binary_ext: ""
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --locked --release -p ${{ matrix.product == 'vca' && 'vibe-coding-analytics' || 'paceflow' }} --bin ${{ matrix.product }}
      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archiveName = "${{ matrix.product }}-${{ matrix.platform.target }}"
          $stageDir = Join-Path "dist" $archiveName
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item "target/release/${{ matrix.product }}.exe" $stageDir
          Copy-Item "crates/${{ matrix.product }}/README.md" $stageDir
          Copy-Item "LICENSE" $stageDir
          $archivePath = Join-Path "dist" "$archiveName.zip"
          Compress-Archive -Path $stageDir -DestinationPath $archivePath -Force
          $hash = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $archivePath -Leaf)" | Out-File "$archivePath.sha256" -Encoding ascii
      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive_name="${{ matrix.product }}-${{ matrix.platform.target }}"
          stage_dir="dist/${archive_name}"
          mkdir -p "${stage_dir}"
          cp "target/release/${{ matrix.product }}" "${stage_dir}/"
          cp "crates/${{ matrix.product }}/README.md" LICENSE "${stage_dir}/"
          tar -C dist -czf "dist/${archive_name}.tar.gz" "${archive_name}"
          shasum -a 256 "dist/${archive_name}.tar.gz" > "dist/${archive_name}.tar.gz.sha256"
      - name: Verify archive layout and execution
        shell: bash
        run: python3 packaging/verify_archive.py "${{ matrix.product }}" "${{ matrix.platform.target }}" "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.product }}-${{ matrix.platform.target }}
          path: |
            dist/*.${{ matrix.platform.ext }}
            dist/*.${{ matrix.platform.ext }}.sha256

  crates:
    needs: package
    uses: ./.github/workflows/publish.yml
    secrets:
      CRATES_PUBLISH_TOKEN: ${{ secrets.CRATES_PUBLISH_TOKEN }}

  publish:
    name: Publish GitHub release
    needs: crates
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: packaging/RELEASE_NOTES.md
          files: dist/*

  install-prebuilt:
    name: Install published binaries (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: Verify prebuilt installation from release metadata
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo binstall --no-confirm --strategies crate-meta-data --root "$RUNNER_TEMP/analytics-install" "vibe-coding-analytics@$version" "paceflow@$version"
          "$RUNNER_TEMP/analytics-install/bin/vca" --version
          "$RUNNER_TEMP/analytics-install/bin/paceflow" --version
