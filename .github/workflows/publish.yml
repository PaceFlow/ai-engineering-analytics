name: Publish to crates.io

on:
  workflow_call:
    secrets:
      CRATES_PUBLISH_TOKEN:
        required: true

concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    if: github.repository == 'PaceFlow/ai-engineering-analytics'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish VCA then Paceflow
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_PUBLISH_TOKEN }}
        run: python3 packaging/publish.py
