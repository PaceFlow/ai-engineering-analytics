[workspace]
members = ["crates/vca", "crates/paceflow"]
default-members = ["crates/paceflow"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/PaceFlow/ai-engineering-analytics"
homepage = "https://github.com/PaceFlow/ai-engineering-analytics"
keywords = ["analytics", "ai", "cli", "git", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
clap = { version = "4.5.60", features = ["derive", "string"] }
rusqlite = { version = "0.38.0", features = ["bundled", "backup"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
anyhow = "1.0.102"
thiserror = "2.0.18"
dirs = "6.0.0"
md5 = "0.8.0"
chrono = { version = "0.4.44", features = ["serde"] }
similar = "2"
terminal_size = "0.4"
regex = "1.12.2"
percent-encoding = "2.3.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.48.0", features = ["net", "rt", "sync", "time"] }
rayon = "1.12.0"
ratatui = "0.30.0"
fs2 = "0.4.3"
tempfile = "3.23.0"
assert_cmd = "2.1.1"
insta = { version = "1.43.2", features = ["yaml"] }

[profile.release]
debug = "line-tables-only"
