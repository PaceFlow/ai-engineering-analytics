<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference Corpus</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
  --accent: #2f5fd0; --accent-soft: #e6edfb; --ok: #1f7a4d; --ok-soft: #e2f3ea;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a09f98; --line: #34332f;
    --accent: #8aa9ff; --accent-soft: #23304f; --ok: #6fd3a0; --ok-soft: #173326;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; }
h1 { font-size: 17px; margin: 0 0 2px; font-weight: 600; }
.sub { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
input, button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 4px 8px; }
button { cursor: pointer; } button:hover { border-color: var(--accent); }
main { padding: 8px 16px 60px; max-width: 1200px; }
h2 { font-size: 13px; margin: 22px 0 6px; font-weight: 600; }
h2 small { color: var(--muted); font-weight: 400; }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
td, th { padding: 6px 8px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; border-top: 0; }
td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.t { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
.saved { color: var(--ok); background: var(--ok-soft); border-radius: 9px; padding: 0 7px; font-size: 12px; white-space: nowrap; }
.tool { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.empty { color: var(--muted); padding: 30px 0; }
@media (max-width: 700px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Reference corpus</h1>
  <div class="sub" id="sub"></div>
  <form id="resample" method="get" action="/">
    <label>seed <input name="seed" id="seed" size="6"></label>
    <label>per project &amp; tool <input name="per" id="per" size="3"></label>
    <button type="submit">Resample</button>
  </form>
  <form method="get" action="/open">
    <input name="session" placeholder="open any session: id, prefix or provider:id" size="44">
    <button type="submit">Open</button>
  </form>
</header>
<main id="list"></main>
<script id="data" type="application/json">/*__CORPUS_APP__*/null</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('data').textContent);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const usd = (n) => n == null ? '—' : '$' + Number(n).toFixed(Number(n) < 1 ? 3 : 2);
  document.getElementById('sub').textContent = 'Saved to ' + D.corpus + ' · projects: ' + (D.projects.length ? D.projects.join(', ') : 'all') +
    ' · saved sessions always stay listed';
  document.getElementById('seed').value = D.seed;
  document.getElementById('per').value = D.per;
  const groups = new Map();
  for (const c of D.candidates) {
    if (!groups.has(c.project)) groups.set(c.project, []);
    groups.get(c.project).push(c);
  }
  const out = [];
  for (const [project, list] of groups) {
    const saved = list.filter((c) => c.saved_at).length;
    out.push('<h2>' + esc(project) + ' <small>' + list.length + ' sessions · ' + saved + ' saved</small></h2><table>' +
      '<tr><th>tool</th><th>started</th><th>title</th><th class="hide-sm">turns</th><th class="hide-sm">agents</th><th>cost</th><th></th></tr>' +
      list.map((c) => '<tr><td class="tool">' + esc(c.provider) + '</td><td class="t">' + esc((c.started_at || '').slice(0, 16).replace('T', ' ')) +
        '</td><td><a href="/review/' + encodeURIComponent(c.provider) + '/' + encodeURIComponent(c.session_id) + '">' +
        esc(c.title || c.session_id) + '</a></td><td class="n hide-sm">' + c.turns + '</td><td class="n hide-sm">' + c.agents +
        '</td><td class="n">' + usd(c.cost) + '</td><td>' +
        (c.saved_at ? '<span class="saved">saved · ' + c.approved + ' approved</span>' : '') + '</td></tr>').join('') + '</table>');
  }
  document.getElementById('list').innerHTML = out.join('') ||
    '<p class="empty">No sessions match. Widen --project, lower --min-turns, or run vca ingest.</p>';
})();
</script>
</body>
</html>
